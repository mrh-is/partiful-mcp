name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - name: Verify version is not already published
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(pnpm view partiful-mcp version 2>/dev/null || echo "")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "::error::package.json version ($LOCAL) is already published to npm — bump it before releasing."
            exit 1
          fi

      - run: pnpm publish --provenance --no-git-checks
